- role: Chuyên viên Phát triển kinh doanh
  org: Planck Technologies AS
  org_note: start-up deep-tech ứng dụng AI vào thiết kế vật liệu thu giữ CO₂
  location: Lysaker, Na Uy
  period: 6/2026 – 12/2026
  project: planck-bd-crm
  bullets:
    - Tìm kiếm khách hàng trong lĩnh vực công nghiệp và năng lượng, tham gia các buổi gặp khách hàng và nhà đầu tư. Quản lý pipeline trên CRM do tôi tự xây dựng, với hơn 500 tổ chức đã sàng lọc và khoảng 60 tổ chức đang theo dõi.
    - Phụ trách các hồ sơ xin tài trợ công, giải thưởng và chương trình tăng tốc của công ty, đã nộp hơn 20 hồ sơ. Lập kế hoạch theo từng hạn nộp, tổng hợp thông tin từ các đồng nghiệp và điều chỉnh nội dung cho phù hợp với từng đơn vị đánh giá.
    - Tự xây dựng và vận hành hai hệ thống CRM cho khách hàng và nhà đầu tư bằng các công cụ lập trình AI, không có kỹ sư hỗ trợ. Quy trình làm việc gồm viết rõ yêu cầu, sao lưu và kiểm thử trước khi đưa vào sử dụng.
    - Viết báo cáo cập nhật hằng tháng, slide phát triển kinh doanh hằng quý và bản tin của công ty.

- role: Thực tập sinh Tư vấn Chuyển đổi xanh
  org: FPT IS
  org_note: công ty dịch vụ công nghệ thuộc FPT, tập đoàn CNTT lớn nhất Việt Nam
  location: Hà Nội, Việt Nam
  period: 11/2024 – 4/2025
  project: fpt-carbon-accounting
  bullets:
    - Xác định dữ liệu phân tán giữa các pháp nhân là rủi ro tuân thủ lớn nhất, và điều phối việc triển khai kiểm kê carbon để khắc phục, cùng lúc ở nhiều khách hàng khi chưa có quy trình mẫu.
    - Đối chiếu nội dung công bố của khách hàng với CSRD, GRI và IFRS S1/S2, từ đó viết báo cáo tóm tắt, kế hoạch khắc phục và tổ chức workshop cho hơn 50 bên liên quan, trình bày theo cách mà các bộ phận vận hành có thể áp dụng được.

- role: Thực tập sinh Tuân thủ thuế
  org: Cục Thuế Hà Nội
  location: Hà Nội, Việt Nam
  period: 6/2023 – 9/2023
  bullets:
    - Xây dựng dashboard Excel tổng hợp dữ liệu tuân thủ từ các phòng ban. Chuẩn hóa khâu kiểm tra và tự động hóa kiểm soát đầu vào giúp giảm 15% thời gian xử lý báo cáo.
