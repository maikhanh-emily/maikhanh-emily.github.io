contact:
  text: Nếu bạn đang tuyển dụng cho năm 2027, làm trong lĩnh vực tài chính khí hậu hoặc năng lượng, hay chỉ đơn giản muốn trao đổi, hãy nhắn cho tôi trên LinkedIn. Tôi luôn trả lời.
