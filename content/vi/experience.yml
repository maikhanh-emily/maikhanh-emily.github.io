- role: Chuyên viên Phát triển kinh doanh
  org: Planck Technologies AS
  org_note: start-up deep-tech dùng AI để thiết kế vật liệu thu giữ CO₂
  location: Lysaker, Na Uy
  period: 6/2026 – 12/2026
  project: planck-bd-crm
  bullets:
    - Tiếp cận các khách hàng công nghiệp và năng lượng, tham gia những buổi gặp khách hàng và nhà đầu tư sau đó. Quản lý từng pipeline trong CRM do tôi tự xây, với hơn 500 tổ chức đã sàng lọc và khoảng 60 tổ chức đang theo sát.
    - Phụ trách các hồ sơ xin tài trợ công, giải thưởng và chương trình tăng tốc của công ty, đã nộp hơn 20 hồ sơ. Lên kế hoạch theo từng hạn nộp, tập hợp thông tin từ đồng nghiệp khắp công ty, và kể câu chuyện của công ty theo một cách riêng cho từng hội đồng đánh giá.
    - Tự xây và vận hành cả hai CRM, cho khách hàng và nhà đầu tư, bằng các trợ lý lập trình AI và không có kỹ sư nào hỗ trợ. Luôn mô tả rõ yêu cầu trước, sao lưu trước, và kiểm thử trước khi đưa vào dùng.
    - Viết bản cập nhật hằng tháng, bộ slide phát triển kinh doanh mỗi quý và bản tin của công ty.

- role: Thực tập sinh Tư vấn Chuyển đổi xanh
  org: FPT IS
  org_note: công ty dịch vụ công nghệ của FPT, tập đoàn CNTT lớn nhất Việt Nam
  location: Hà Nội, Việt Nam
  period: 11/2024 – 4/2025
  project: fpt-carbon-accounting
  bullets:
    - Nhận ra dữ liệu bị phân mảnh chính là rủi ro tuân thủ lớn nhất khi báo cáo cho nhiều pháp nhân, rồi điều phối việc triển khai kiểm kê carbon để giải quyết chuyện đó, cùng lúc cho nhiều khách hàng và không có sẵn quy trình mẫu nào.
    - Đối chiếu các công bố của khách hàng với CSRD, GRI và IFRS S1/S2, rồi chuyển kết quả thành báo cáo tóm tắt, kế hoạch khắc phục và những buổi workshop cho hơn 50 bên liên quan, bằng ngôn ngữ mà đội vận hành đọc là làm được ngay.

- role: Thực tập sinh Tuân thủ thuế
  org: Cục Thuế Hà Nội
  location: Hà Nội, Việt Nam
  period: 6/2023 – 9/2023
  bullets:
    - Làm các dashboard Excel tổng hợp dữ liệu tuân thủ từ nhiều phòng ban. Nhờ chuẩn hóa khâu kiểm tra và tự động kiểm soát dữ liệu đầu vào, thời gian xử lý báo cáo giảm được 15%.
