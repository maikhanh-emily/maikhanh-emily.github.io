- degree: Thạc sĩ Kinh doanh, chuyên ngành Tài chính
  school: BI Norwegian Business School
  location: Bergen và Oslo, Na Uy
  period: 8/2025 – 7/2027
  notes:
    - Học bổng quốc tế (top 15% trong hơn 500 ứng viên) và Dean's List mùa thu 2025 (top 10% khóa thạc sĩ).
    - Các môn chính gồm định giá ứng dụng, chiến lược tài chính, đầu tư, quản trị rủi ro, tài trợ vốn mạo hiểm và năng lượng trong chuyển dịch xanh.

- degree: Cử nhân Kinh tế kinh doanh quốc tế
  school: Đại học Ngoại thương
  location: Hà Nội, Việt Nam
  period: 9/2021 – 6/2025
  notes:
    - Tốt nghiệp loại Xuất sắc. Chương trình giảng dạy bằng tiếng Anh.
    - Học kỳ trao đổi tại Friedrich-Alexander-Universität Erlangen-Nürnberg, Đức (9/2023 – 1/2024), trọng tâm thực hành kinh doanh bền vững.
