github: ""          # e.g. https://github.com/your-handle
cv_file: ""         # e.g. /static/MaiKhanhDo_CV.pdf  (copy the PDF into static/ first)

# Final address of the site. Used for the RSS feed, link previews and the vCard.
# Set it after the first deploy, e.g. https://your-handle.github.io
